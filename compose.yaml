services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workify
      POSTGRES_USER: workify
      POSTGRES_PASSWORD: workify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workify_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workify -d workify"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  workify_data:
